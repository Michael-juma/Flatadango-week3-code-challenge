<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flatadango</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Flatadango</h1>
    <div id="main">
        <aside id="menu">
            <ul id="films"></ul>
        </aside>
        <section id="movie-details">
            <h2 id="movie-title">Movie Title</h2>
            <img id="movie-poster" src="" alt="Movie Poster">
            <p id="movie-description"></p>
            <p><strong>Runtime:</strong> <span id="movie-runtime"></span> minutes</p>
            <p><strong>Showtime:</strong> <span id="movie-showtime"></span></p>
            <p><strong>Available Tickets:</strong> <span id="available-tickets"></span></p>
            <button id="buy-ticket-btn">Buy Ticket</button>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
