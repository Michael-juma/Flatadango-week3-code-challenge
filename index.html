<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Listings with Buy Ticket</title>
  <style>
    .film-card {
      border: 1px solid #b85b5b;
      padding: 20px;
      margin: 20px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 300px;
      box-shadow: 0 4px 8px rgba(32, 121, 63, 0.1);
    }
    .film-card img {
      width: 100%;
      height: auto;
      border-radius: 5px;
    }
    .film-card h3 {
      margin-top: 15px;
      font-size: 1.5em;
    }
    .film-card p {
      font-size: 1em;
      margin: 10px 0;
    }
    .film-card .showtime {
      font-weight: bold;
    }
    .film-card .tickets-sold {
      margin-top: 10px;
      color: green;
    }
    .film-card button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .film-card button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h1>Film Listings</h1>
  <div id="film-list"></div>

<script src="app.js"></script>
</body>
</html>
